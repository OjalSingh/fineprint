name: Watch policies
on:
  schedule: [{ cron: '17 5 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/watch.mjs
      - run: |
          git config user.name "fine-print-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed snapshots
          git diff --cached --quiet || git commit -m "Update policy feed" && git push
